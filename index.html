html{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:400 .9rem/1.4 var(--mono);-webkit-font-smoothing:antialiased}

<script>
/* Тема и стартовое состояние — до отрисовки, чтобы не было мерцания */
(function(){
  var KEY='suite-theme', saved=null;
  try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved!=='dark'&&saved!=='light') saved=null;
  var S=window.__suite={saved:saved,recipe:'',
    theme:saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')};
  var h=location.hash, m=/^#hf=([A-Za-z0-9_-]{1,8000})$/.exec(h);
  if(m) S.recipe=m[1];
  var root=document.documentElement;
  root.setAttribute('data-theme',S.theme);
  root.setAttribute('data-tab',(m||h==='#hashforge')?'hashforge':h==='#signal'?'signal':'hashforge');
})();
</script>

<script>
/* suite-bridge: связь с оболочкой (тема, высота, ссылка). Логика приложения не затрагивается. */
(function(){
  var root=document.documentElement, S=null, hs={}, last=0;
  try{ if(parent!==window) S=parent.__suite; }catch(e){}
  var B=window.suiteBridge={embedded:parent!==window, recipe:(S&amp;&amp;S.recipe)||'',
    post:function(m){ parent.postMessage(m,'*'); },
    on:function(t,f){ hs[t]=f; }};
  function theme(t){ root.setAttribute('data-theme', t==='dark'?'dark':'light'); }
  if(S&amp;&amp;S.theme) theme(S.theme);
  if(!B.embedded) return;
  function report(){
    var b=document.body; if(!b) return;
    var cs=getComputedStyle(b);
    var h=Math.ceil(b.getBoundingClientRect().height+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0));
    if(h>0&amp;&amp;h!==last){ last=h; B.post({type:'height',value:h}); }
  }
  addEventListener('message',function(e){
    var d=e.data; if(e.source!==parent||!d) return;
    if(d.type==='theme') theme(d.value);
    else if(d.type==='init'){ theme(d.theme); B.recipe=d.recipe||''; }
    else if(d.type==='measure'){ last=0; report(); }
    else if(hs[d.type]) hs[d.type](d);
  });
  document.addEventListener('DOMContentLoaded',function(){
    new ResizeObserver(report).observe(document.body); report(); B.post({type:'hello'});
  });
  addEventListener('load',report);
})();
</script>

      <button type=&quot;button&quot; class=&quot;act sec&quot; id=&quot;clearHistBtn&quot; style=&quot;padding:3px 8px;font-size:.7rem&quot;>Очистить всё</button>
    </div>
    <div class=&quot;history-box&quot; id=&quot;history&quot;></div>
  </section>

  <p class=&quot;note&quot;>
    ⚡ 100% клиентская обработка. MD5 и HMAC-MD5 вычисляются встроенным JS-ядром, семейство SHA — через нативный WebCrypto API.
    При маскировке ввод исключается из локальной истории для предотвращения утечек. Инструмент учебный: хэш отдельных символов легко подбирается перебором, не используйте его для защиты паролей.
  </p>
</main>

<script>
/* ——— Инициализация и Утилиты ——— */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (txt != null) node.textContent = txt;
  return node;
};
const enc = new TextEncoder();
const hasCrypto = !!(window.crypto &amp;&amp; crypto.subtle);

if (!hasCrypto) {
  $('cryptoLed').className = 'led warn';
  $('cryptoStatus').textContent = 'WebCrypto недоступен (только MD5)';
}

// Unicode-сегментация
const seg = (window.Intl &amp;&amp; Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
const splitChars = t => seg ? Array.from(seg.segment(t), x => x.segment) : Array.from(t);
const splitWords = t => (t.match(/\S+/g) || []);
function splitText(t, unit) {
  if (unit === 'word') return splitWords(t);
  if (unit === 'phrase') return t.trim() === '' ? [] : [t];
  return splitChars(t);
}

const SHOW_CHAR = { ' ': '␠', '\n': '↵', '\t': '⇥' };
const getRadio = id => document.querySelector('#' + id + ' input:checked')?.value;
const getFlag = v => !!document.querySelector('#opt input[value=&quot;' + v + '&quot;]')?.checked;

/* ——— Форматирование байт ——— */
function bytesToHex(buf) {
  const b = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < b.length; i++) s += b[i].toString(16).padStart(2, '0');
  return s;
}

function bytesToBase64(buf) {
  const b = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin);
}

function bytesToBase64Url(buf) {
  return bytesToBase64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function formatDigest(buf, fmt) {
  if (fmt === 'b64') return bytesToBase64(buf);
  if (fmt === 'b64url') return bytesToBase64Url(buf);
  return bytesToHex(buf);
}

/* ——— Криптографический движок ——— */

// Нативный RFC 1321 MD5 с байтовым выводом
function md5Bytes(bytes) {
  const n = bytes.length;
  const len = ((n + 8 >> 6) + 1) * 16;
  const x = new Int32Array(len);
  for (let i = 0; i < n; i++) x[i >> 2] |= bytes[i] << ((i % 4) * 8);
  x[n >> 2] |= 0x80 << ((n % 4) * 8);
  x[len - 2] = (n * 8) &amp; 0xffffffff;
  x[len - 1] = Math.floor(n / 0x20000000);

  const K = [
    0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee, 0xf57c0faf, 0x4787c62a, 0xa8304613, 0xfd469501,
    0x698098d8, 0x8b44f7af, 0xffff5bb1, 0x895cd7be, 0x6b901122, 0xfd987193, 0xa679438e, 0x49b40821,
    0xf61e2562, 0xc040b340, 0x265e5a51, 0xe9b6c7aa, 0xd62f105d, 0x02441453, 0xd8a1e681, 0xe7d3fbc8,
    0x21e1cde6, 0xc33707d6, 0xf4d50d87, 0x455a14ed, 0xa9e3e905, 0xfcefa3f8, 0x676f02d9, 0x8d2a4c8a,
    0xfffa3942, 0x8771f681, 0x6d9d6122, 0xfde5380c, 0xa4beea44, 0x4bdecfa9, 0xf6bb4b60, 0xbebfbc70,
    0x289b7ec6, 0xeaa127fa, 0xd4ef3085, 0x04881d05, 0xd9d4d039, 0xe6db99e5, 0x1fa27cf8, 0xc4ac5665,
    0xf4292244, 0x432aff97, 0xab9423a7, 0xfc93a039, 0x655b59c3, 0x8f0ccc92, 0xffeff47d, 0x85845dd1,
    0x6fa87e4f, 0xfe2ce6e0, 0xa3014314, 0x4e0811a1, 0xf7537e82, 0xbd3af235, 0x2ad7d2bb, 0xeb86d391
  ];
  const s = [7,12,17,22, 5,9,14,20, 4,11,16,23, 6,10,15,21];
  let a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;

  for (let o = 0; o < len; o += 16) {
    let A = a0, B = b0, C = c0, D = d0;
    for (let i = 0; i < 64; i++) {
      let F, g;
      if (i < 16) { F = (B &amp; C) | (~B &amp; D); g = i; }
      else if (i < 32) { F = (D &amp; B) | (~D &amp; C); g = (5 * i + 1) % 16; }
      else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + x[o + g]) | 0;
      A = D; D = C; C = B;
      const sh = s[(i >> 4) * 4 + (i % 4)];
      B = (B + ((F << sh) | (F >>> (32 - sh)))) | 0;
    }
    a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
  }
  const out = new Uint8Array(16);
  [a0, b0, c0, d0].forEach((v, i) => {
    for (let j = 0; j < 4; j++) out[i * 4 + j] = (v >>> (j * 8)) &amp; 0xff;
  });
  return out;
}

const BLOCK = { 'MD5': 64, 'SHA-1': 64, 'SHA-256': 64, 'SHA-384': 128, 'SHA-512': 128 };

async function hashBytes(algo, bytes) {
  if (algo === 'MD5') return md5Bytes(bytes);
  if (!hasCrypto) throw new Error('WebCrypto недоступен для SHA');
  return new Uint8Array(await crypto.subtle.digest(algo, bytes));
}

// RFC 2104 HMAC поверх любого хэша (работает и с пустым ключом)
async function hmacBytes(algo, keyBytes, msgBytes) {
  const B = BLOCK[algo];
  const k = keyBytes.length > B ? await hashBytes(algo, keyBytes) : keyBytes;
  const ipad = new Uint8Array(B + msgBytes.length);
  const opad = new Uint8Array(B);
  for (let i = 0; i < B; i++) {
    const kb = i < k.length ? k[i] : 0;
    ipad[i] = kb ^ 0x36;
    opad[i] = kb ^ 0x5c;
  }
  ipad.set(msgBytes, B);
  const inner = await hashBytes(algo, ipad);
  const outer = new Uint8Array(B + inner.length);
  outer.set(opad);
  outer.set(inner, B);
  return hashBytes(algo, outer);
}

async function computeDigest(algo, text, salt = '', isHmac = false) {
  const data = enc.encode(text);
  if (isHmac) return hmacBytes(algo, enc.encode(salt), data);
  return hashBytes(algo, data);
}

/* ——— UI Генераторы Групп ——— */
function makeChips(boxId, type, items, def) {
  const box = $(boxId);
  const tail = box.querySelector('input[type=text], input[type=number]');
  items.forEach(([val, label]) => {
    const l = el('label', 'chip');
    const inp = el('input');
    inp.type = type;
    inp.name = boxId;
    inp.value = val;
    if (val === def) inp.checked = true;
    inp.addEventListener('change', () => render());
    l.append(inp, el('span', '', label));
    if (tail) box.insertBefore(l, tail);
    else box.append(l);
  });
}

makeChips('algo', 'radio', [
  ['MD5','MD5'], ['SHA-1','SHA-1'], ['SHA-256','SHA-256'], ['SHA-384','SHA-384'], ['SHA-512','SHA-512']
], hasCrypto ? 'SHA-256' : 'MD5');

makeChips('fmt', 'radio', [
  ['hex','HEX'], ['b64','Base64'], ['b64url','Base64URL']
], 'hex');

makeChips('len', 'radio', [
  ['0','полный'], ['8','8'], ['16','16'], ['32','32'], ['custom','своя']
], '0');

makeChips('sep', 'radio', [
  ['none','без'], ['-','-'], [':',':'], [',',','], [' ','пробел'], ['_','_'], ['custom','свой']
], '-');

makeChips('unit', 'radio', [
  ['char','Символ'], ['word','Слово'], ['phrase','Фраза целиком']
], 'char');

makeChips('saltpos', 'radio', [
  ['front','Спереди'], ['back','Сзади']
], 'front');

makeChips('opt', 'checkbox', [
  ['hmac','Режим HMAC (по соли)'],
  ['pos','Индекс позиции'],
  ['rev','Обратный порядок'],
  ['dbl','Двойной хэш'],
  ['upper','ВЕРХНИЙ РЕГИСТР'],
  ['skip','Пропуск пробелов'],
  ['mask','Скрыть ввод'],
  ['hist','Запоминать ввод (локально)'],
  ['hashResult','Хэшировать итог']
], null);

/* ——— Безопасное хранилище и кодирование ——— */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const MAX_ELEMS = 5000;

function toUrlB64(str) {
  let bin = '';
  enc.encode(str).forEach(c => { bin += String.fromCharCode(c); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromUrlB64(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  s += '='.repeat((4 - s.length % 4) % 4);
  const bin = atob(s);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

/* Тема управляется оболочкой (suite-bridge) */

/* ——— Безопасная История (opt-in, сохраняется по завершении ввода) ——— */
const HIST_KEY = 'hashforge_history';
function getHistory() {
  try {
    const v = JSON.parse(store.get(HIST_KEY) || '[]');
    return Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
  } catch { return []; }
}
function pushHistory(val) {
  if (!val.trim() || val.length > 500) return;
  let items = getHistory().filter(x => x !== val);
  items.unshift(val);
  store.set(HIST_KEY, JSON.stringify(items.slice(0, 10)));
  renderHistory();
}
function deleteHistoryItem(val) {
  store.set(HIST_KEY, JSON.stringify(getHistory().filter(x => x !== val)));
  renderHistory();
}
function clearAllHistory() {
  store.del(HIST_KEY);
  renderHistory();
}

function renderHistory() {
  const panel = $('histPanel');
  const box = $('history');
  box.replaceChildren();
  const list = getHistory();
  if (!list.length || getFlag('mask')) {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  list.forEach(txt => {
    const wrap = el('div', 'hist-chip');
    const bText = el('button', 'hist-text', txt);
    bText.title = txt;
    bText.onclick = () => { $('t').value = txt; render(); };
    const bDel = el('button', 'hist-del', '×');
    bDel.title = 'Удалить из истории';
    bDel.onclick = () => deleteHistoryItem(txt);
    wrap.append(bText, bDel);
    box.append(wrap);
  });
}
$('clearHistBtn').onclick = clearAllHistory;
renderHistory();

/* ——— Сохранение состояния в URL ——— */
function shareRecipe() {
  const cfg = {
    a: getRadio('algo'),
    u: getRadio('unit'),
    f: getRadio('fmt'),
    s: getRadio('sep'),
    l: getRadio('len'),
    sp: getRadio('saltpos'),
    hm: getFlag('hmac'),
    ps: getFlag('pos'),
    rv: getFlag('rev'),
    db: getFlag('dbl'),
    up: getFlag('upper'),
    sk: getFlag('skip'),
    hr: getFlag('hashResult'),
    cs: $('cs').value,
    cl: $('customLen').value,
    pf: $('prefix').value,
    sf: $('suffix').value,
    o: $('off').value
  };
  const str = toUrlB64(JSON.stringify(cfg));
  if (window.suiteBridge &amp;&amp; suiteBridge.embedded) { suiteBridge.post({ type: 'share', recipe: str }); return; }
  history.replaceState(null, '', '#' + str);
  copyToClipboard(window.location.href, 'Ссылка на рецепт скопирована');
}

function loadFromUrl() {
  try {
    const hash = window.suiteBridge &amp;&amp; suiteBridge.embedded ? suiteBridge.recipe : window.location.hash.slice(1);
    if (!hash) return;
    const cfg = JSON.parse(fromUrlB64(hash));
    const setR = (id, val) => {
      for (const inp of document.querySelectorAll('#' + id + ' input[type=radio]')) {
        if (inp.value === val) { inp.checked = true; break; }
      }
    };
    if (cfg.a) setR('algo', cfg.a);
    if (cfg.u) setR('unit', cfg.u);
    if (cfg.f) setR('fmt', cfg.f);
    if (cfg.s) setR('sep', cfg.s);
    if (cfg.l) setR('len', cfg.l);
    if (cfg.sp) setR('saltpos', cfg.sp);

    const setF = (val, state) => {
      const inp = document.querySelector('#opt input[value=&quot;' + val + '&quot;]');
      if (inp) inp.checked = !!state;
    };
    setF('hmac', cfg.hm);
    setF('pos', cfg.ps);
    setF('rev', cfg.rv);
    setF('dbl', cfg.db);
    setF('upper', cfg.up);
    setF('skip', cfg.sk);
    setF('hashResult', cfg.hr);

    if (cfg.cs) $('cs').value = cfg.cs;
    if (cfg.cl) $('customLen').value = cfg.cl;
    if (cfg.pf) $('prefix').value = cfg.pf;
    if (cfg.sf) $('suffix').value = cfg.sf;
    if (cfg.o) $('off').value = cfg.o;
  } catch (_) {}
}

/* ——— Ядро рендеринга ——— */
let seq = 0;
let lastResultText = '';
let notifyTimer;

function notify(msg) {
  $('st').textContent = msg;
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => { $('st').textContent = ''; }, 2600);
}

async function copyToClipboard(txt, msg = 'Скопировано') {
  try {
    await navigator.clipboard.writeText(txt);
  } catch {
    const ta = el('textarea');
    ta.value = txt;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  notify(msg);
}

// Debounce-обертка
function debounce(fn, ms = 110) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

async function render() {
  const currentSeq = ++seq;
  const out = $('out');
  const chain = $('chain');
  const algo = getRadio('algo');
  const unit = getRadio('unit') || 'char';
  const fmt = getRadio('fmt') || 'hex';
  const saltPos = getRadio('saltpos') || 'front';

  let lenSetting = getRadio('len');
  let lenVal = Math.max(0, (lenSetting === 'custom') ? (parseInt($('customLen').value, 10) || 0) : +lenSetting);

  const up = getFlag('upper');
  const pos = getFlag('pos');
  const dbl = getFlag('dbl');
  const rev = getFlag('rev');
  const hide = getFlag('mask');
  const isHmac = getFlag('hmac');
  const hashRes = getFlag('hashResult');

  const rawInput = $('t').value;
  const salt = $('s').value;
  const off = Math.max(0, (parseInt($('off').value, 10) || 1) - 1);
  const prefix = $('prefix').value;
  const suffix = $('suffix').value;

  $('t').classList.toggle('hide', hide);
  $('s').classList.toggle('hide', hide);
  $('s').type = hide ? 'password' : 'text';
  renderHistory();
  $('tMeta').textContent = `${splitChars(rawInput).length} симв.`;

  let sv = getRadio('sep');
  sv = (sv === 'none') ? '' : (sv === 'custom') ? $('cs').value : sv;

  // Отключение несовместимых опций
  const skipChk = document.querySelector('#opt input[value=&quot;skip&quot;]');
  if (skipChk) {
    const disabled = unit !== 'char';
    skipChk.disabled = disabled;
    skipChk.closest('.chip').style.opacity = disabled ? '.35' : '';
  }

  // Генерация рецепта
  const unitName = (unit === 'word') ? 'слово' : (unit === 'phrase') ? 'всю фразу' : 'символ';
  let recipeDesc = '';
  if (isHmac) {
    recipeDesc = `HMAC-${algo}(ключ: ${salt ? '«соль»' : 'пустой'}, данные: ${(pos ? '№ + ' : '') + unitName})`;
  } else {
    const sPrefix = (salt &amp;&amp; saltPos === 'front') ? 'соль + ' : '';
    const sSuffix = (salt &amp;&amp; saltPos === 'back') ? ' + соль' : '';
    recipeDesc = `${algo}(${sPrefix}${pos ? '№ + ' : ''}${unitName}${sSuffix})`;
  }
  if (dbl) recipeDesc += ` ➔ повторный ${algo}`;
  recipeDesc += ` | срез: [с ${off + 1}${lenVal ? ' дл. ' + lenVal : ' до конца'}]`;
  recipeDesc += ` | кодировка: ${fmt.toUpperCase()}`;
  recipeDesc += ` | порядок: ${rev ? 'реверс' : 'прямой'}, разделитель: ${sv ? '«' + sv + '»' : 'без'}`;
  if (hashRes) recipeDesc += ` | ➔ пост-хэширование всей строки`;
  $('recipe').textContent = recipeDesc;

  // Разбиение потока
  let parts = splitText(rawInput, unit);
  if (unit === 'char' &amp;&amp; getFlag('skip')) parts = parts.filter(c => c.trim());
  if (rev) parts = [...parts].reverse();
  const totalParts = parts.length;
  if (totalParts > MAX_ELEMS) parts = parts.slice(0, MAX_ELEMS);

  $('n').textContent = totalParts > parts.length ? `${parts.length} из ${totalParts}` : parts.length;
  $('chainTitle').textContent = `Матрица хэшей (${unit === 'word' ? 'по словам' : unit === 'phrase' ? 'по фразам' : 'по символам'})`;

  if (!parts.length) {
    out.replaceChildren(el('span', 'ph', 'Введите текст для расчёта хэш-потока...'));
    chain.replaceChildren();
    $('l').textContent = '0';
    $('copyBtn').disabled = true;
    lastResultText = '';
    return;
  }

  // Вычисление элементов
  let rows;
  try {
    rows = await Promise.all(parts.map(async (elem, i) => {
      const idxTag = pos ? `${i + 1}:` : '';
      let textToHash;
      if (isHmac) {
        textToHash = idxTag + elem;
      } else {
        textToHash = (saltPos === 'front') ? (salt + idxTag + elem) : (idxTag + elem + salt);
      }

      let digestBytes = await computeDigest(algo, textToHash, salt, isHmac);
      if (dbl) {
        digestBytes = await computeDigest(algo, bytesToHex(digestBytes), '', false);
      }

      // Форматирование и срез
      let formatted = formatDigest(digestBytes, fmt);
      let sliced = lenVal ? formatted.slice(off, off + lenVal) : formatted.slice(off);
      if (up) sliced = sliced.toUpperCase();

      return {
        elem,
        fullHex: bytesToHex(digestBytes),
        finalStr: sliced
      };
    }));
  } catch (err) {
    if (currentSeq === seq) out.textContent = 'Ошибка: ' + err.message;
    return;
  }

  if (currentSeq !== seq) return;

  // Пост-процессинг
  let finalJoined = rows.map(r => r.finalStr).join(sv);
  if (hashRes) {
    const postBytes = await computeDigest(algo, finalJoined, '', false);
    if (currentSeq !== seq) return;
    finalJoined = formatDigest(postBytes, fmt);
    if (up) finalJoined = finalJoined.toUpperCase();
  }
  finalJoined = prefix + finalJoined + suffix;

  lastResultText = finalJoined;
  $('l').textContent = finalJoined.length;
  $('copyBtn').disabled = false;

  // Рендер строки результатов
  const frag = document.createDocumentFragment();
  if (hashRes) {
    frag.append(el('span', 'a', finalJoined));
  } else {
    if (prefix) frag.append(el('span', 'sp', prefix));
    rows.forEach((r, i) => {
      if (i &amp;&amp; sv) frag.append(el('span', 'sp', sv));
      frag.append(el('span', i % 2 ? 'b' : 'a', r.finalStr));
    });
    if (suffix) frag.append(el('span', 'sp', suffix));
  }
  out.replaceChildren(frag);

  // Отрисовка интерактивных плиток (с ограничением DOM)
  chain.replaceChildren();
  const TILE_LIMIT = 120;
  const tilesToRender = rows.slice(0, TILE_LIMIT);

  tilesToRender.forEach((r, i) => {
    const tile = el('button', 'tile');
    tile.type = 'button';

    const dispChar = hide ? '•' : (SHOW_CHAR[r.elem] || r.elem);
    tile.title = `Скопировать хэш для: ${dispChar}`;

    const top = el('div', 'tile-top');
    const glyph = el('span', 'tile-g', dispChar);
    
    // Метрики
    let metaTxt = '';
    if (unit === 'char') {
      metaTxt = hide ? 'U+••••' : 'U+' + Array.from(r.elem).map(c => c.codePointAt(0).toString(16).toUpperCase().padStart(4, '0')).join(' ');
    } else {
      metaTxt = `${r.elem.length} симв.`;
    }
    const metaSpan = el('span', 'tile-u', metaTxt);
    top.append(glyph, metaSpan);

    // Цветовой отпечаток (энтропия первых 8 байт)
    const fp = el('div', 'fp');
    for (let j = 0; j < 8; j++) {
      const byteHex = r.fullHex.slice(j * 2, j * 2 + 2) || '00';
      const bVal = parseInt(byteHex, 16);
      const stripe = el('i');
      stripe.style.background = `hsl(${Math.round(bVal / 255 * 360)} 75% 50%)`;
      fp.append(stripe);
    }

    const hashSpan = el('span', 'tile-h', r.finalStr || '(пусто)');

    tile.append(top, fp, hashSpan);
    tile.onclick = () => copyToClipboard(r.finalStr, `Хэш элемента «${dispChar}» скопирован`);
    chain.append(tile);
  });

  const notes = [];
  if (totalParts > rows.length) notes.push(`Обработаны первые ${rows.length} из ${totalParts} элементов.`);

    'у':'⠥','ф':'⠋','х':'⠓','ц':'⠉','ч':'⠟','ш':'⠱','щ':'⠭','ъ':'⠷','ы':'⠮','ь':'⠾',
    'э':'⠪','ю':'⠳','я':'⠫',
    '1':'⠼⠁','2':'⠼⠃','3':'⠼⠉','4':'⠼⠙','5':'⠼⠑','6':'⠼⠋','7':'⠼⠛','8':'⠼⠓','9':'⠼⠊','0':'⠼⠚',
    ' ':' ','.':'⠲',',':'⠂','!':'⠖','?':'⠦','-':'⠤'
  };

  // Флаговый семафор (International Maritime Semaphore)
  const SEMAPHORE_MAP = {
    'a':'N-NE','b':'N-E','c':'N-SE','d':'N-S','e':'N-SW','f':'N-W','g':'N-NW',
    'h':'NE-E','i':'NE-SE','j':'E-S','k':'NE-N','l':'NE-SW','m':'NE-W','n':'NE-NW',
    'o':'E-SE','p':'E-S','q':'E-SW','r':'E-W','s':'E-NW','t':'SE-S','u':'SE-SW',
    'v':'SW-W','w':'SE-NW','x':'S-SW','y':'S-W','z':'S-NW'
  };

  // =========================================================================
  // 2. ДЕТЕРМИНИРОВАННЫЕ АЛГОРИТМЫ ПРЕОБРАЗОВАНИЯ
  // =========================================================================

  // UTF-8 Binary (8-bit)
  function toBinary(str) {
    return Array.from(new TextEncoder().encode(str))
      .map(b => b.toString(2).padStart(8, '0')).join(' ');
  }

  // Hexadecimal (RFC 4648 §8)
  function toHex(str) {
    return Array.from(new TextEncoder().encode(str))
      .map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
  }

  // Base64 (RFC 4648 §4)
  function toBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  // Base32 (RFC 4648 §6)
  function toBase32(str) {
    const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
    const bytes = new TextEncoder().encode(str);
    let bits = 0, value = 0, output = '';
    for (let i = 0; i < bytes.length; i++) {
      value = (value << 8) | bytes[i];
      bits += 8;
      while (bits >= 5) {
        output += alphabet[(value >>> (bits - 5)) &amp; 31];
        bits -= 5;
      }
    }
    if (bits > 0) output += alphabet[(value << (5 - bits)) &amp; 31];
    while (output.length % 8 !== 0) output += '=';
    return output;
  }

  // URI Percent-Encoding (RFC 3986)
  function toPercentEncoding(str) {
    return encodeURIComponent(str);
  }

  // Punycode / IDNA (RFC 3492)
  function toPunycode(str) {
    const base = 36, tmin = 1, tmax = 26, skew = 38, damp = 700, initialBias = 72, initialN = 128;
    function adapt(delta, numpoints, firsttime) {
      delta = firsttime ? Math.floor(delta / damp) : delta >> 1;
      delta += Math.floor(delta / numpoints);
      let k = 0;
      while (delta > ((base - tmin) * tmax) >> 1) {
        delta = Math.floor(delta / (base - tmin));
        k += base;
      }
      return k + Math.floor(((base - tmin + 1) * delta) / (delta + skew));
    }
    const input = Array.from(str);
    let n = initialN, delta = 0, bias = initialBias, out = '';
    const b = input.filter(c => c.charCodeAt(0) < 128);
    out = b.join('');
    let h = b.length, bLen = b.length;
    if (bLen > 0) out += '-';
    while (h < input.length) {
      let m = 0x7fffffff;
      input.forEach(c => {
        const cp = c.codePointAt(0);
        if (cp >= n &amp;&amp; cp < m) m = cp;
      });
      delta += (m - n) * (h + 1);
      n = m;
      for (let i = 0; i < input.length; i++) {
        const cp = input[i].codePointAt(0);
        if (cp < n) delta++;
        if (cp === n) {
          let q = delta;
          for (let k = base; ; k += base) {
            const t = k <= bias ? tmin : (k >= bias + tmax ? tmax : k - bias);
            if (q < t) break;
            const digit = t + ((q - t) % (base - t));
            out += String.fromCharCode(digit < 26 ? digit + 97 : digit + 22);
            q = Math.floor((q - t) / (base - t));
          }
          out += String.fromCharCode(q < 26 ? q + 97 : q + 22);
          bias = adapt(delta, h + 1, h === bLen);
          delta = 0;
          h++;
        }
      }
      delta++;
      n++;
    }
    return 'xn--' + out;
  }

  // ROT13 (Latin, 26 букв) / ROT16 (Кириллица, 32 буквы без 'ё') — Строгие инволюции
  function rotInvolution(str) {
    return str.replace(/[a-zA-Z]/g, c => {
      const base = c <= 'Z' ? 65 : 97;
      return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
    }).replace(/[а-яА-ЯёЁ]/g, c => {
      if (c === 'ё') return 'ч';
      if (c === 'Ё') return 'Ч';
      const isUpper = c === c.toUpperCase();
      const code = c.toLowerCase().charCodeAt(0);
      if (code >= 1072 &amp;&amp; code <= 1103) {
        const shifted = ((code - 1072 + 16) % 32) + 1072;
        const res = String.fromCharCode(shifted);
        return isUpper ? res.toUpperCase() : res;
      }
      return c;
    });
  }

  // Атбаш (Зеркальная перестановка A<->Z, А<->Я) — Строгая инволюция
  function atbash(str) {
    return Array.from(str).map(c => {
      const code = c.charCodeAt(0);
      if (code >= 65 &amp;&amp; code <= 90) return String.fromCharCode(90 - (code - 65));
      if (code >= 97 &amp;&amp; code <= 122) return String.fromCharCode(122 - (code - 97));
      if (code >= 1040 &amp;&amp; code <= 1071) return String.fromCharCode(1071 - (code - 1040));
      if (code >= 1072 &amp;&amp; code <= 1103) return String.fromCharCode(1103 - (code - 1072));
      return c;
    }).join('');
  }

  // Tap Code (Полибий 5x5, К=С) — Строгий тюремный шифр
  function toTapCode(str) {
    const grid = [
      ['A','B','C','D','E'],
      ['F','G','H','I','J'],
      ['L','M','N','O','P'],
      ['Q','R','S','T','U'],
      ['V','W','X','Y','Z']
    ];
    const words = str.toUpperCase().split(/\s+/);
    const encodedWords = words.map(w => {
      const letters = [];
      for (let ch of w) {
        if (ch === 'K') ch = 'C';
        let found = false;
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            if (grid[r][c] === ch) {
              letters.push('.'.repeat(r+1) + ' ' + '.'.repeat(c+1));
              found = true;
              break;
            }
          }
          if (found) break;
        }
      }
      return letters.join('  ');
    }).filter(w => w.length > 0);
    return encodedWords.join('  /  ');
  }

  // Шифр Бэкона (Bacon's Cipher 5-bit)
  function toBacon(str) {
    return Array.from(str.toUpperCase()).map(c => {
      const code = c.charCodeAt(0);
      if (code >= 65 &amp;&amp; code <= 90) {
        const val = code - 65;
        return val.toString(2).padStart(5, '0').replace(/0/g, 'A').replace(/1/g, 'B');
      }
      if (c === ' ') return '/';
      return '';
    }).filter(c => c !== '').join(' ');
  }

  // Азбука Морзе ITU / ГОСТ
  function toMorse(str) {
    return str.toLowerCase().split(/\s+/).map(word => {
      return Array.from(word).map(c => MORSE_ITU[c] || '').filter(Boolean).join(' ');
    }).filter(w => w.length > 0).join('  /  ');
  }

  // NATO / ICAO
  function toNato(str) {
    return Array.from(str.toLowerCase()).map(c => {
      if (c === ' ') return '/';
      return NATO_ICAO[c] || '';
    }).filter(Boolean).join(' ');
  }

  // Связной радиоалфавит (Кириллица)
  function toRuRadio(str) {
    return Array.from(str.toLowerCase()).map(c => {
      if (c === ' ') return '/';
      return RU_RADIO[c] || '';
    }).filter(Boolean).join(' ');
  }

  // Шрифт Брайля (ISO / ГОСТ)
  function toBraille(str) {
    return Array.from(str.toLowerCase()).map(c => BRAILLE_GRADE1[c] || c).join('');
  }

  // Семафорная азбука
  function toSemaphore(str) {
    return str.toLowerCase().split(/\s+/).map(w => {
      return Array.from(w).map(c => SEMAPHORE_MAP[c] || '').filter(Boolean).join(' ');
    }).filter(w => w.length > 0).join('  /  ');
  }

  // Zero-Width Steganography (100% обратимый UTF-8 бинарный поток)
  const ZW_ZERO = '\u200B';
  const ZW_ONE  = '\u200C';
  const ZW_FLAG = '\u200D';
  function toZeroWidth(str) {
    const bytes = new TextEncoder().encode(str);
    let bits = '';
    bytes.forEach(b => bits += b.toString(2).padStart(8,'0'));
    return ZW_FLAG + Array.from(bits).map(b => b === '0' ? ZW_ZERO : ZW_ONE).join('') + ZW_FLAG;
  }
  function previewZeroWidth(raw) {
    if (!raw) return '';
    return Array.from(raw).map(c => {
      if (c === ZW_ZERO) return '·';
      if (c === ZW_ONE) return '▪';
      if (c === ZW_FLAG) return '│';
      return c;
    }).join('');
  }

  // SHA-256 (FIPS PUB 180-4)
  async function computeSha256(str) {
    if (!str) return '';
    const buf = new TextEncoder().encode(str);
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Расчёт энтропии Шеннона
  function calcEntropy(str) {
    if (!str) return '0.00';
    const len = str.length;
    const freq = {};
    for (let ch of str) freq[ch] = (freq[ch] || 0) + 1;
    let ent = 0;
    for (let ch in freq) {
      const p = freq[ch] / len;
      ent -= p * Math.log2(p);
    }
    return ent.toFixed(2);
  }

  // =========================================================================
  // 3. РЕЕСТР КАНАЛОВ И СПЕЦИФИКАЦИЙ
  // =========================================================================

  const MATRIX = [
    {
      id: 'binary', title: 'BINARY (UTF-8)', cat: 'rfc', std: 'RFC 3629',

    },
    {

    },
    {

    {

    {

    },
    {

    },
    {
      id: 'nato', title: 'NATO / ICAO PHONETIC', cat: 'radio', std: 'ICAO Doc 9432',

    },
    {

    },

  // =========================================================================
  // 4. ГЕНЕРАЦИЯ ИНТЕРФЕЙСА И WEB AUDIO
  // =========================================================================

  const grid = document.getElementById('matrixGrid');
  const cardElements = {};

  MATRIX.forEach((ch, idx) => {

    }

    card.innerHTML = `
      <div class=&quot;cell-head&quot;>
        <div class=&quot;cell-title-block&quot;>

          <span class=&quot;cell-title&quot;>${ch.title}</span>

        </div>
        <div class=&quot;cell-actions&quot;>
          ${extraBtn}
          <button class=&quot;action-btn copy-btn&quot; type=&quot;button&quot;>Копировать</button>

    grid.appendChild(card);

    const bodyEl = card.querySelector('.cell-body');

    copyBtn.addEventListener('click', () => {
      const raw = bodyEl.dataset.raw || '';

        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Копировать';
          copyBtn.classList.remove('copied');
        }, 1200);
      });
    });

    if (ch.audio) {
      const playBtn = card.querySelector('#playAudioBtn');
      playBtn.addEventListener('click', () => toggleAudio(bodyEl.dataset.raw || ''));
    }

    cardElements[ch.id] = { card, bodyEl, byteEl, warnEl, config: ch };
  });

  // Audio Synthesizer (Морзе синусоида 700 Гц)
  let audioCtx = null;
  let isPlaying = false;
  let audioTimer = null;

  function stopAudio() {
    isPlaying = false;
    if (audioTimer) clearTimeout(audioTimer);
    const btn = document.getElementById('playAudioBtn');
    if (btn) {
      btn.textContent = '🔊 Тон';
      btn.classList.remove('active-play');
    }
  }

  function toggleAudio(morseStr) {
    if (isPlaying) { stopAudio(); return; }
    if (!morseStr || !/[.-]/.test(morseStr)) return;

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    isPlaying = true;
    const btn = document.getElementById('playAudioBtn');
    if (btn) {
      btn.textContent = '⏹ Стоп';
      btn.classList.add('active-play');
    }

    const dotMs = 70;
    const freq = 700;
    const sequence = [];

    for (let char of morseStr) {
      if (char === '.') {
        sequence.push({ on: true, ms: dotMs });
        sequence.push({ on: false, ms: dotMs });
      } else if (char === '-') {
        sequence.push({ on: true, ms: dotMs * 3 });
        sequence.push({ on: false, ms: dotMs });
      } else if (char === ' ') {
        sequence.push({ on: false, ms: dotMs * 2 });
      } else if (char === '/') {
        sequence.push({ on: false, ms: dotMs * 4 });
      }
    }

    let i = 0;
    function step() {
      if (!isPlaying || i >= sequence.length) { stopAudio(); return; }
      const item = sequence[i++];
      if (item.on) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.004);
        gain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + (item.ms/1000) - 0.004);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + (item.ms/1000));
      }
      audioTimer = setTimeout(step, item.ms);
    }
    step();
  }

  // =========================================================================
  // 5. ДИСПЕТЧЕР ОБНОВЛЕНИЯ И АНАЛИЗА ВВОДА
  // =========================================================================

  const src = document.getElementById('src');
  const charCount = document.getElementById('charCount');
  const byteCount = document.getElementById('byteCount');
  const entropyVal = document.getElementById('entropyVal');
  const liveDot = document.getElementById('liveDot');

  async function updateAll() {
    const text = src.value;
    const len = Array.from(text).length;
    const bytes = new TextEncoder().encode(text).length;
    const hasCyrillic = /[а-яёА-ЯЁ]/.test(text);
    const hasLatin = /[a-zA-Z]/.test(text);

    charCount.textContent = len;
    byteCount.textContent = bytes;
    entropyVal.textContent = calcEntropy(text);

    if (len > 0) liveDot.classList.remove('idle');
    else { liveDot.classList.add('idle'); stopAudio(); }

    for (let ch of MATRIX) {
      const el = cardElements[ch.id];

      // Подсветка несовместимости с кириллицей / латиницей
      if (ch.latinOnly &amp;&amp; hasCyrillic) {
        el.card.classList.add('warn-cyrillic');
        el.warnEl.style.display = 'inline-block';
        el.warnEl.textContent = '⚠️ Не латиница: пропущено';
      } else if (ch.cyrillicOnly &amp;&amp; hasLatin) {
        el.card.classList.add('warn-cyrillic');
        el.warnEl.style.display = 'inline-block';
        el.warnEl.textContent = '⚠️ Не кириллица: пропущено';
      } else {
        el.card.classList.remove('warn-cyrillic');
        el.warnEl.style.display = 'none';
      }

      if (!text) {
        el.bodyEl.textContent = '—';
        el.bodyEl.classList.add('empty');
        el.bodyEl.dataset.raw = '';
        el.byteEl.textContent = '0 байт';
        continue;
      }

      let res = '';
      if (ch.async) {
        res = await ch.fn(text);
      } else {
        try {
          res = ch.fn(text);
        } catch(e) {
          res = 'Ошибка кодирования стандарта';
        }
      }

      el.bodyEl.dataset.raw = res;
      el.bodyEl.textContent = ch.previewFn ? ch.previewFn(res) : (res || '—');
      el.bodyEl.classList.toggle('empty', !res);
      const outBytes = new TextEncoder().encode(res).length;
      el.byteEl.textContent = `${outBytes} байт`;
    }
  }

  src.addEventListener('input', updateAll);
  updateAll();

  // Presets &amp; Clear
  document.querySelectorAll('.preset-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      src.value = tag.dataset.val;
      updateAll();
    });
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    src.value = '';
    src.focus();
    updateAll();
  });

  // Экспорт всей матрицы
  document.getElementById('btnExport').addEventListener('click', function() {
    const text = src.value;
    if (!text) return;
    let dump = `=== SIGNAL 2.5 MATRIX EXPORT ===\n`;
    dump += `INPUT: ${text}\n`;
    dump += `UTC: ${new Date().toISOString()}\n`;
    dump += `========================================\n\n`;

    MATRIX.forEach(ch => {
      const raw = cardElements[ch.id].bodyEl.dataset.raw || '';
      dump += `[${ch.title} | ${ch.std}]\n${raw}\n\n`;
    });

    navigator.clipboard.writeText(dump).then(() => {
      const old = this.textContent;
      this.textContent = '✓ Экспортировано!';
      setTimeout(() => { this.textContent = old; }, 1500);
    });
  });

  // Категории
  let curCategory = 'all';
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      curCategory = this.dataset.cat;
      MATRIX.forEach(ch => {
        const show = (curCategory === 'all' || ch.cat === curCategory);
        cardElements[ch.id].card.style.display = show ? '' : 'none';
      });
    });
  });

  // Тема управляется оболочкой (suite-bridge)

  // UTC часы
  const utcClock = document.getElementById('utcClock');
  function tick() {
    utcClock.textContent = 'UTC ' + new Date().toISOString().substring(11, 19);
  }
  tick();
  setInterval(tick, 1000);

})();
</script>
</body>
</html>"></iframe>
<script>
(function(){
  var S=window.__suite, root=document.documentElement, KEY='suite-theme';
  var frames={hashforge:document.getElementById('hashforge'),signal:document.getElementById('signal')};
  var tabs=[].slice.call(document.querySelectorAll('.tab')), btn=document.getElementById('themeBtn');
  var scrollY={hashforge:0,signal:0}, mq=matchMedia('(prefers-color-scheme: dark)');
  function send(name,msg){ var w=frames[name].contentWindow; if(w) w.postMessage(msg,'*'); }
  function broadcast(msg){ send('hashforge',msg); send('signal',msg); }

  /* Тема: один переключатель, один ключ */
  function applyTheme(t,persist){
    S.theme=t; root.setAttribute('data-theme',t);
    btn.textContent=t==='dark'?'☀ Светлая':'◐ Тёмная';
    if(persist){ S.saved=t; try{localStorage.setItem(KEY,t);}catch(e){} }
    broadcast({type:'theme',value:t});
  }
  btn.onclick=function(){ applyTheme(S.theme==='dark'?'light':'dark',true); };
  mq.addEventListener('change',function(e){ if(!S.saved) applyTheme(e.matches?'dark':'light',false); });
  applyTheme(S.theme,false);

  /* Вкладки: iframe остаются живыми, состояние сохраняется */
  function curTab(){ return root.getAttribute('data-tab'); }
  function setTab(t,focus){
    var prev=curTab();
    if(prev!==t){ scrollY[prev]=window.scrollY; root.setAttribute('data-tab',t); }
    tabs.forEach(function(b){ var on=b.dataset.tab===t; b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; if(on&&focus) b.focus(); });
    send(t,{type:'measure'});
    if(prev!==t) requestAnimationFrame(function(){ window.scrollTo(0,scrollY[t]||0); });
    try{ history.replaceState(null,'',t==='hashforge'&&S.recipe?'#hf='+S.recipe:'#'+t); }catch(e){}
  }
  tabs.forEach(function(b,i){
    b.onclick=function(){ setTab(b.dataset.tab); };
    b.onkeydown=function(e){
      var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0; if(!d) return;
      e.preventDefault(); setTab(tabs[(i+d+tabs.length)%tabs.length].dataset.tab,true);
    };
  });
  setTab(curTab());

  /* Сообщения от приложений (источник проверяется по contentWindow) */
  addEventListener('message',function(e){
    var name=null, d=e.data;
    for(var k in frames) if(frames[k].contentWindow===e.source) name=k;
    if(!name||!d||typeof d!=='object') return;
    if(d.type==='height'){
      if(d.value>0&&d.value<100000) frames[name].style.height=d.value+'px';
    }else if(d.type==='hello'){
      send(name,{type:'init',theme:S.theme,recipe:S.recipe});
    }else if(d.type==='share'&&name==='hashforge'&&/^[A-Za-z0-9_-]{1,8000}$/.test(d.recipe||'')){
      /* «Ссылка» в HashForge: адрес формирует оболочка, а не about:srcdoc */
      S.recipe=d.recipe;
      try{ history.replaceState(null,'','#hf='+S.recipe); }catch(e){}
      send('hashforge',{type:'share-url',url:location.href.split('#')[0]+'#hf='+S.recipe});
    }
  });

  /* Переход по готовой ссылке в уже открытой странице */
  addEventListener('hashchange',function(){
    var h=location.hash, m=/^#hf=([A-Za-z0-9_-]{1,8000})$/.exec(h);
    if(m){ if(m[1]!==S.recipe){ S.recipe=m[1]; send('hashforge',{type:'load-recipe',recipe:S.recipe}); } setTab('hashforge'); }
    else if(h==='#signal'||h==='#hashforge') setTab(h.slice(1));
  });
})();
</script>
